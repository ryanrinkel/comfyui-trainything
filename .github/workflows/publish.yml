# NOT TO BE ENABLED BEFORE GATE N (the rename; PLAN-COMFY §10 question 8).
# A registry version can never be overwritten, only bumped, and the package
# name, PublisherId and DisplayName in pyproject.toml are the brand. Until gate
# N: no REGISTRY_ACCESS_TOKEN secret in the repository (without it this job
# cannot publish), and no version bump pushed to master on a public remote.
#
# The workflow below is the one docs.comfy.org/registry/publishing shows
# (read 2026-10-08), with the branch changed from main to master, as the
# docs say to do. It publishes the version in pyproject.toml whenever
# pyproject.toml changes on master, or by hand (workflow_dispatch).
name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }} ## Add your own personal access token to your Github Repository secrets and reference it here.
