# Comfy Registry metadata (docs.comfy.org/registry/specifications). Nothing is
# published before gate N (PLAN-COMFY §10 question 8): the name, PublisherId and
# DisplayName are the brand and may change with the rename. The registry asks
# for names without "ComfyUI" in them; this one stays until gate N.

[project]
name = "comfyui-trainything"
description = "Send a ComfyUI batch to a phone for review with TrainyThing; the keepers, the notes and the seeds come back into the graph."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# The same three lines as requirements.txt (ComfyUI already ships Pillow and numpy).
dependencies = ["segno>=1.6", "pillow", "numpy"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/ryanrinkel/comfyui-trainything"
Documentation = "https://github.com/ryanrinkel/comfyui-trainything#readme"
"Bug Tracker" = "https://github.com/ryanrinkel/comfyui-trainything/issues"

[tool.comfy]
PublisherId = "trainything"  # placeholder until gate N (PLAN-COMFY §10 question 8)
DisplayName = "TrainyThing"
# The registry wants an Icon URL (square, <= 400x400); there is no public URL
# until the repository is public, so it stays empty until then.
Icon = ""
includes = []
requires-comfyui = ">=0.39.0"  # verified at K0 against ComfyUI 0.39.0, comfy_api latest (docs/V3-NOTES.md); __init__.REQUIRES_COMFYUI

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["comfy: drives the harness ComfyUI (skipped without torch)"]
